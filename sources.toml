# ===== Phase 6 扩源（2026-08-03）=====
# 白鲸出海首页"最新文章"：页面 JS 渲染，但底层是 jQuery AJAX 接口
#   GET /index/ajax/get_article/ → {data: {article_list: [{id,title,views,add_time,...}]}}
# 返回真文章链接 article/ID（非论坛 question/），浏览量 2k–80k，带来源/摘要。
# type=json_api + data_path 导航到嵌套数组，url_prefix + url_field 拼出完整 URL。
[[sources]]
id = "baijing"
game = "全行业"
name = "白鲸出海"
section = "首页「最新文章」"
type = "json_api"
url = "https://www.baijing.cn/index/ajax/get_article/"
data_path = "data.article_list"
url_prefix = "https://www.baijing.cn/article"
url_field = "id"
enabled = true
max_items = 8
notes = """
偏出海/跨境/科技，游戏直接相关约 20%。文章格式 /article/ID（非 forum/question/ 论坛）。
含浏览量(views)、来源(from)、摘要(synopsis)、相对发布时间(add_time)。
适合「行业情报站·出海/买量/AI」列。禁止编造 forum 或 question 链接。
"""
