ytes in the offline artifact; use short, reusable URLs in the DOM.

function gpImageURL(uri){
 if(gpLocalImage(uri))return uri;
 if(!/^data:image\/(?:jpeg|webp|png);base64,[A-Za-z0-9+/=]+$/.test(uri||''))return '';

}
