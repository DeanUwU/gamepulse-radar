function renderSopReview(c,r,changed){
 const v=r.concept_review,s=r.sop,byID=new Map(v.sources.map(x=>[x.id,x]));
 const id=key=>'gp-sop-'+c.id+'-'+key;
 const access=x=>x?.access==='index_only'?'索引':['metadata_read','topic_list_metadata','topic_page_metadata'].includes(x?.access)?'元数据':x?.access==='body_read'?'正文':x?.access==='image_read'?'图文':'待核';
 const refs=ids=>'<div class="concept-sources">'+[...new Set(ids||[])].map(key=>{const x=byID.get(key);return x&&safeURL(x.url)?`<a class="review-ref" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.publisher)} · ${esc(x.date||x.date_display||'日期待核')} ↗<span class="sop-source-kind">${esc(access(x))}</span></a>`:''}).join('')+'</div>';
 const heading=x=>`<span class="sop-number">${esc(x.number)}</span><span>${esc(x.title)}</span>`;
 const section=(key,body)=>{const x=s.sections.find(x=>x.id===key);return body?`<section class="sop-section" id="${esc(id(key))}" data-sop-part="${key}"><h3 class="sop-heading" tabindex="-1">${heading(x)}</h3>${body}</section>`:`<details class="sop-section sop-empty" id="${esc(id(key))}" data-sop-part="${key}"><summary class="sop-heading">${heading(x)}<span class="sop-pending">待补 · 展开</span></summary><p class="sop-note">本案暂未取得这一部分的可用资料。</p></details>`};
 const fact=(label,value)=>value?`<div class="sop-fact"><small>${esc(label)}</small><b>${esc(value)}</b></div>`:'';
 const range=s.observed_from?(s.observed_from===s.observed_to?s.observed_from:s.observed_from+' — '+s.observed_to):'';
 const scope=`<div class="sop-facts">${fact('产品 / 平台',s.product+(s.platform?' · '+s.platform:''))}${fact('活动对象',s.campaign)}${fact('地区 / 服区',s.market)}${fact('已发现发布日',range)}${fact('公告预告开始日',s.announced_launch_date)}${fact('已有上线确认至',s.launch_confirmed_by)}</div>`;
 const points=[...v.mappings.map(x=>({text:x.content,source_ids:x.source_ids})),...(s.product_context||[])];
 const product=(points.length?'<div class="sop-content-list">'+points.map(x=>`<article class="sop-content-item"><b>${esc(x.text)}</b>${refs(x.source_ids)}</article>`).join('')+'</div>':'')+renderVersionPictures(c,v);
 const concepts=(v.verdict?`<p class="sop-core">${esc(v.verdict)}</p>`:'')+(v.mappings.length?'<div class="sop-concepts">'+v.mappings.map(x=>`<div class="sop-concept"><b>${esc(x.wording)}</b><small>${esc(x.origin||'资料中的说法')}</small></div>`).join('')+'</div>':'');
 const packaging=v.mappings.map(x=>`<article class="concept-map"><div class="concept-from"><small>产品内容</small><b>${esc(x.content)}</b></div><div class="concept-to"><small>包装说法 · ${esc(x.origin||'已有资料')}</small><b>${esc(x.wording)}</b><p>${esc(x.interpretation)}</p>${refs(x.source_ids)}</div></article>`).join('')+(v.finding?`<details class="review-deep"><summary>综合判断 · 分析归纳</summary><p>${esc(v.finding)}</p></details>`:'');
 const resourceRows=s.resources.map(x=>{const source=byID.get(x.source_id);return source&&safeURL(source.url)?`<div class="sop-resource"><span>${esc(x.type)}<br><small>${esc(x.scope)}</small></span><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a><time>${esc(x.date?.slice(5)||'日期待核')}</time></div>`:''});
 const resources=(resourceRows.length?'<div class="sop-resource-list">'+resourceRows.slice(0,5).join('')+'</div>'+(resourceRows.length>5?`<details class="review-deep"><summary>更多资源 · ${resourceRows.length-5}条</summary><div class="sop-resource-list">${resourceRows.slice(5).join('')}</div></details>`:''):'')+renderVideoPreviews(c,v);
 const tags=v.tag_groups.map(x=>`<article class="concept-tags"><h4>${esc(x.name)}</h4><div class="card-tags">${x.tags.map(t=>`<button class="tag review-tag" data-review-tag="${esc(t)}" type="button">#${esc(t)}</button>`).join('')}</div>${x.reading?`<p>${esc(x.reading)}</p>`:''}${refs(x.source_ids)}</article>`).join('');
 const samples=(v.sample_ids||[]).map(key=>{const x=byID.get(key);return x?`<article class="review-material"><div><b>${esc(x.date||'日期待核')} ${esc(x.time||'')}</b><small>${esc(x.publisher)}</small></div><a class="source" href="${esc(safeURL(x.url)?x.url:'#')}" target="_blank" rel="noopener noreferrer">${esc(x.title)} ↗</a><div class="card-tags">${(x.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><small>${esc(x.identity||'')} · ${esc(x.state||access(x))}</small>${x.note?`<p>${esc(x.note)}</p>`:''}</article>`:''}).join('');
 const tagBody=tags+(samples?`<details class="review-deep concept-samples"><summary>查看${v.sample_ids.length}条${esc(v.sample_label||'短视频样本')} · 日期、账号与话题</summary><div class="review-materials">${samples}</div></details>`:'');
 const node=x=>`<li class="sop-node"><time>${esc(x.date)}</time><div>${esc(x.title)}${refs(x.source_ids)}</div></li>`;
 const cadence=(s.nodes.length?`<ol class="sop-timeline">${s.nodes.slice(0,4).map(node).join('')}</ol>`+(s.nodes.length>4?`<details class="review-deep"><summary>更多发布节点 · ${s.nodes.length-4}条</summary><ol class="sop-timeline">${s.nodes.slice(4).map(node).join('')}</ol></details>`:''):'')+(s.cta?`<div class="sop-cta"><h4>参与入口 <small>${esc(s.cta.basis||'已有资料')}</small></h4><p>${esc(s.cta.text)}</p>${refs(s.cta.source_ids)}</div>`:'');
 const learning=(v.reuse?`<div class="sop-learning"><h4>可迁移方法</h4><p>${esc(v.reuse)}</p>${s.conditions?`<h4>适用条件 · 建议</h4><p>${esc(s.conditions)}</p>`:''}</div>`:'')+`<details class="review-deep sop-gaps"><summary>证据缺口与待补项</summary><ul>${[...(v.gaps||[]),...(!s.cta?['参与规则或明确行动入口尚未核齐。']:[]),...(!s.conditions?['适用条件尚未单独整理。']:[])].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`+`<details class="review-deep"><summary>全部来源 · ${v.sources.length}条</summary><div class="sop-sources-all">${v.sources.map(x=>`<div>${refs([x.id])}<p>${esc(x.title)}</p></div>`).join('')}</div></details>`;
 const short={scope:'范围',product:'产品内容',concept:'营销概念',packaging:'噱头包装',resources:'传播资源',tags:'话题Tag',cadence:'节奏与入口',learning:'可借鉴'};
 return `<section class="campaign-review content-review concept-review sop-review" aria-label="Campaign营销档案"><style>${campaignSopCSS}</style><div class="review-head"><h3>营销档案</h3><span>${changed?'依据有变化 · 待复审':'分析更新 · '+esc(r.as_of)}</span></div><nav class="sop-nav" aria-label="档案章节">${s.sections.map(x=>`<a href="#${esc(id(x.id))}" data-sop-target="${esc(id(x.id))}" data-missing="${x.availability==='missing'}"><span>${esc(x.number)}</span>${short[x.id]}</a>`).join('')}</nav>${section('scope',scope)}${section('product',product)}${section('concept',concepts)}${section('packaging',packaging)}${section('resources',resources)}${section('tags',tagBody)}${section('cadence',cadence)}${section('learning',learning)}</section>`;
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-sop-target]');if(!a)return;const target=document.getElementById(a.dataset.sopTarget);if(!target)return;e.preventDefault();if(target.tagName==='DETAILS')target.open=true;target.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});target.querySelector('.sop-heading')?.focus({preventScroll:true})});

// Keep image bytes in the offline artifact; use short, reusable URLs in the DOM.
const gpAssetUrls=new Map();
function gpImageURL(uri){
 if(!/^data:image\/(?:jpeg|webp|png);base64,[A-Za-z0-9+/=]+$/.test(uri||''))return '';
 if(gpAssetUrls.has(uri))return gpAssetUrls.get(uri);
 try{const split=uri.indexOf(','),type=uri.slice(5,uri.indexOf(';')),raw=atob(uri.slice(split+1)),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type}));gpAssetUrls.set(uri,url);return url}catch{return uri}
}
addEventListener('unload',()=>{for(const url of gpAssetUrls.values())URL.revokeObjectURL(url)});

const reportMediaStyle=`<style>.report-media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.report-media-card{margin:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#111c24}.report-media-button{display:block;position:relative;width:100%;padding:0;border:0;background:#080e13;cursor:zoom-in;color:#fff}.report-media-button img{display:block;width:100%;height:170px;object-fit:contain}.report-media-link{display:block}.report-media-zoom{position:absolute;left:8px;bottom:8px;color:#fff;background:#0b151ee8;padding:4px 9px;border:1px solid #ffffff55;border-radius:5px;cursor:zoom-in;font-size:11px}.report-media-button span{position:absolute;right:8px;bottom:8px;font-size:10px;background:#0b151edc;padding:3px 7px;border-radius:5px}.report-media-caption{padding:12px}.report-media-caption h4{margin:0 0 6px;font-size:13px}.report-media-caption p{font-size:11px;line-height:1.8;color:#b5c7d0;margin:7px 0}.report-media-caption small{display:block;font-size:10px;line-height:1.8;color:var(--muted)}.report-media-caption .source{font-size:11px}.report-video-metric{display:block;color:var(--mint);font-size:15px;font-weight:700;margin:8px 0 3px}.report-media-note{font-size:10px!important;color:var(--muted)!important;line-height:1.8!important}.gp-media-preview{position:fixed;inset:0;margin:auto;width:min(1040px,94vw);max-width:94vw;max-height:92dvh;overflow:auto;border:1px solid #3a5664;border-radius:12px;padding:0;background:#101a22;color:#e0e9ed}.gp-media-preview::backdrop{background:#000c}.gp-media-preview-head{position:sticky;top:0;z-index:2;background:#101a22;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 18px;border-bottom:1px solid #2e4350}.gp-media-preview-head h3{font-size:15px;margin:0}.gp-media-preview-head button{color:#c2d4dc;border:1px solid #36515d;border-radius:6px;padding:5px 10px;background:#142530;cursor:pointer}.gp-media-preview .preview-source-image{display:block;cursor:pointer}.gp-media-preview .preview-source-image img{display:block;max-width:100%;width:100%;max-height:67dvh;object-fit:contain;background:#060b10}.gp-media-preview-caption{padding:15px 18px;font-size:12px;line-height:1.8}.gp-media-preview-caption p{margin:5px 0}.gp-media-preview-caption a{color:#7ce3be;margin-right:16px}.gp-media-preview-caption small{display:block;color:#91a8b7;overflow-wrap:anywhere}.report-media-card img[hidden]{display:none}@media(max-width:760px){.report-media-grid{grid-template-columns:1fr}.report-media-button img{height:auto;max-height:250px}.gp-media-preview-head h3{font-size:13px}}</style>`;
function reportImageOK(x){return /^data:image\/(?:jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(x||'')}
function reportTime(x){try{return new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return x}}
function reportMediaButton(c,kind,x){const url=kind==='videos'?x.url:x.source_page;return reportImageOK(x.image)&&safeURL(url)?`<div class="report-media-button"><a class="report-media-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${kind==='videos'?'原站播放':'打开图片来源'}：${esc(x.title)}"><img loading="lazy" src="${gpImageURL(x.image)}" alt="${esc(x.title+' · '+x.type)}"><span>${kind==='videos'?'原站播放 ↗':'图片来源 ↗'}</span></a><button type="button" class="report-media-zoom" data-media-campaign="${esc(c.id)}" data-media-kind="${kind}" data-media-id="${esc(x.id)}" aria-label="放大预览：${esc(x.title)}">放大</button></div>`:''}

function renderVersionPictures(c,v){const p=v.media_packet;if(!p?.pictures?.length)return '';return `${reportMediaStyle}<div class="review-piece report-version-pictures"><h4>${esc(p.picture_heading||'主要版本内容 · 图片预览')}</h4><div class="report-media-grid">${p.pictures.map(x=>`<figure class="report-media-card">${reportMediaButton(c,'pictures',x)}<figcaption class="report-media-caption"><h4>${esc(x.title)}</h4><p>${esc(x.content)}</p><p>包装观察：${esc(x.packaging)}</p><a class="source" href="${esc(x.source_page)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a></figcaption></figure>`).join('')}</div></div>`}
function renderVideoPreviews(c,v){const p=v.media_packet;if(!p?.videos?.length)return '';return `${reportMediaStyle}<div class="review-piece report-video-previews"><h4>${esc(p.video_heading||'播放较高的视频样本')}</h4>${p.selection_note?`<p class="report-media-note">${esc(p.selection_note)}</p>`:''}<div class="report-media-grid">${p.videos.map(x=>`<article class="report-media-card">${reportMediaButton(c,'videos',x)}<div class="report-media-caption"><h4>${esc(x.title)}</h4><small>${esc(x.publisher)} · ${esc(x.date)}</small><small>${esc(x.window_label)}</small>${Number.isFinite(x.views)?`<span class="report-video-metric" title="${x.views.toLocaleString('zh-CN')}次">${(x.views/10000).toFixed(1)}万播放</span><small>采集：${esc(reportTime(x.observed_at))} · 单视频累计</small>`:''}${Number.isFinite(x.likes)?`<span class="report-video-metric">${(x.likes/10000).toFixed(1)}万赞</span><small>采集：${esc(reportTime(x.observed_at))} · 单视频累计</small>`:''}<p>${esc(x.reason)}</p><a class="source" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">原站播放 ↗</a></div></article>`).join('')}</div></div>`}
document.addEventListener('click',e=>{const close=e.target.closest('[data-media-close]');if(close){document.getElementById('gp-media-preview')?.close();return}const b=e.target.closest('[data-media-campaign]');if(!b)return;const p=campaignReviews[b.dataset.mediaCampaign]?.concept_review?.media_packet;const kind=b.dataset.mediaKind;if(!p||!['pictures','videos'].includes(kind))return;const x=p[kind].find(x=>x.id===b.dataset.mediaId);if(!x||!reportImageOK(x.image))return;let dialog=document.getElementById('gp-media-preview');if(!dialog){dialog=document.createElement('dialog');dialog.id='gp-media-preview';dialog.className='gp-media-preview';document.body.append(dialog)}const url=kind==='videos'?x.url:x.source_page;const original=x.source_image;dialog.innerHTML=`<div class="gp-media-preview-head"><h3>${esc(x.title)} · ${esc(x.type)}</h3><button type="button" data-media-close aria-label="关闭预览">关闭</button></div><a class="preview-source-image" href="${esc(safeURL(kind==='videos'?url:original)?(kind==='videos'?url:original):url)}" target="_blank" rel="noopener noreferrer" aria-label="点击图片打开${kind==='videos'?'原站视频':'原图'}"><img src="${gpImageURL(x.image)}" alt="${esc(x.title)}"></a><div class="gp-media-preview-caption"><small>点击大图可打开${kind==='videos'?'原站视频':'原图'}。</small>${kind==='videos'?`<p>${esc(x.publisher)} · ${esc(x.date)} · ${Number.isFinite(x.views)?x.views.toLocaleString('zh-CN')+'次播放':''}</p>${x.observed_at?`<small>播放量采集于 ${esc(reportTime(x.observed_at))}</small>`:''}<p>${esc(x.reason)}</p><small>${esc(x.reading_scope)}</small>`:`<p>${esc(x.content)}</p><small>${esc(x.publisher)} · ${esc(x.date_display)}</small><p>${esc(x.basis)}</p>`}${safeURL(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${kind==='videos'?'原站播放':'查看来源'} ↗</a>`:''}${safeURL(original)?`<a href="${esc(original)}" target="_blank" rel="noopener noreferrer">原始图片 ↗</a>`:''}</div>`;dialog.showModal()});

function conceptSearch(v){return [v.verdict,v.finding,v.reuse,...v.mappings.flatMap(x=>[x.content,x.wording,x.interpretation]),...v.tag_groups.flatMap(x=>[x.name,...x.tags]),...v.sources.map(s=>s.title)].join(' ')}
function renderConceptReview(c,r,changed){
 if(r.sop)return renderSopReview(c,r,changed);
 const v=r.concept_review,byID=new Map(v.sources.map(s=>[s.id,s]));
 const links=ids=>'<div class="concept-sources">'+ids.map(id=>{const s=byID.get(id);return s&&safeURL(s.url)?`<a class="review-ref" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)} · ${esc(s.date||s.date_display||'当前页面，发布时间未定')} ↗</a>`:''}).join('')+'</div>';
 const mapping=v.mappings.map(x=>`<article class="concept-map"><div class="concept-from"><small>现有产品内容</small><b>${esc(x.content)}</b></div><div class="concept-to"><small>对外包装说法 · ${esc(x.origin)}</small><b>${esc(x.wording)}</b><p>${esc(x.interpretation)}</p>${links(x.source_ids)}</div></article>`).join('');
 const tags=v.tag_groups.map((x,i)=>`<article class="concept-tags"><h4>${esc(x.name)}</h4><div class="card-tags">${x.tags.map(t=>`<button class="tag review-tag" data-review-tag="${esc(t)}" type="button">#${esc(t)}</button>`).join('')}</div>${x.reading&&!(c.id==='lostlight-ss10'&&i===0)?`<p>${esc(x.reading)}</p>`:''}${links(x.source_ids)}</article>`).join('');
 const samples=v.sample_ids.map(id=>{const s=byID.get(id);return `<article class="review-material"><div><b>${esc(s.date)} ${esc(s.time||'')}</b><small>${esc(s.publisher)}</small></div><a class="source" href="${esc(safeURL(s.url)?s.url:'#')}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><div class="card-tags">${s.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><p>${esc(s.identity)}</p><small>${esc(s.state)}；${esc(s.note)}</small></article>`}).join('');
 return `<section class="campaign-review content-review concept-review" aria-label="案例分析"><style>.concept-map{display:grid;grid-template-columns:155px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:9px;margin:10px 0;padding:14px}.concept-map small{display:block;font-size:10px;color:var(--muted);line-height:1.7}.concept-map b{display:block;font-size:13px;margin:5px 0}.concept-map p,.concept-tags p{font-size:12px;line-height:1.9;color:#bdcbd4;margin:8px 0}.concept-from{border-right:1px solid var(--line);padding-right:12px}.concept-tags{border-bottom:1px solid var(--line);padding:12px 0}.concept-tags h4{font-size:12px;margin:0 0 8px}.concept-review .review-material .source{display:block;margin-top:8px}.concept-review .review-material .card-tags{margin-top:8px}.concept-review .review-material small{line-height:1.8}.concept-review .tag{white-space:normal;overflow-wrap:anywhere}.concept-sources{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}.concept-review .concept-sources .review-ref{display:inline-block;font-size:10px;line-height:1.5;margin:0;color:var(--muted)}.concept-review .concept-tags .tag{font-size:14px;font-weight:650;padding:6px 11px;background:#dcecdf;color:#20543f;border-color:#a9c9b3;line-height:1.5}.concept-review .concept-tags .tag:hover{background:#cce3d0}@media(max-width:760px){.concept-map{grid-template-columns:1fr;gap:8px;padding:12px}.concept-from{border-right:0;border-bottom:1px solid var(--line);padding-bottom:8px}}</style><div class="review-head"><h3>${esc(v.title)}</h3><span>${changed?'依据有变化 · 待复审':'概念试稿 · '+esc(r.as_of)}</span></div><p class="review-verdict">${esc(v.verdict)}</p><p class="review-scope">${esc(v.scope.replace('；只重做此案','').replace('只重做此案。',''))}</p>${renderVersionPictures(c,v)}${mapping?`<div class="review-piece"><h4>现有内容怎样变成噱头</h4>${mapping}</div>`:''}${tags?`<div class="review-piece"><h4>${esc(v.tags_title||'宣传期短视频话题 · 分工判断')}</h4>${tags}</div>`:''}${v.sample_ids.length?`<details class="review-deep concept-samples"><summary>查看${v.sample_ids.length}条${esc(v.sample_label||'抖音样本')} · 日期、账号、话题</summary><div class="review-materials">${samples}</div></details>`:''}<div class="review-piece"><h4>本案判断<small>分析归纳</small></h4><p>${esc(v.finding)}</p></div>${renderVideoPreviews(c,v)}<div class="review-piece"><h4>可借鉴的包装方法<small>建议</small></h4><p>${esc(v.reuse)}</p></div><details class="review-deep"><summary>仍未证实的部分</summary><ul>${v.gaps.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details></section>`;
}

document.getElementById('report').innerHTML=renderConceptReview({id:"jcc-anniv-202608"},campaignReviews["jcc-anniv-202608"],false);
document.querySelectorAll('[data-review-tag]').forEach(b=>{const s=document.createElement('span');s.className=b.className;s.textContent=b.textContent;b.replaceWith(s)});
</script></body></html>
